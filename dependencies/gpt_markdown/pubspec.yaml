name: gpt_markdown
description: "Powerful Flutter Markdown & LaTeX Renderer: Rich Text, Math, Tables, Links, and Text Selection. Ideal for ChatGPT, Gemini, and more."
version: 1.1.7
publish_to: none
homepage: https://gptmarkdown.com
repository: https://github.com/Infinitix-LLC/gpt_markdown
issue_tracker: https://github.com/Infinitix-LLC/gpt_markdown/issues

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 与 JO-AIClient 主工程共用同一份本地 fork，避免同名包出现两个不同来源
  flutter_math_fork:
    path: ../flutter_math_fork

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: lib/fonts/JetBrainsMono-Regular.ttf

topics:
  - markdown
  - latex
  - selectable
  - chatgpt
  - gemini
