flutter_launcher_icons:
  android: true
  ios: true
  # 桌面图标必须自带一块不透明的底：资源管理器、开始菜单、快捷方式、应用菜单、
  # 启动器默认图标都只读构建期写死的这一张图，不会跟随系统明暗切换。成品由
  # scripts/icons/build_icons.py 合成（纯黑圆角方块 + 深色版图形）。
  image_path: assets/app_icon.png
  image_path_ios: "assets/app_icon.png"
  image_path_ios_dark_transparent: "assets/app_icon.png"
  # 母版是透明底，而 iOS 图标不允许带透明通道：开启后按下面的底色压平。
  # 深色图标走 image_path_ios_dark_transparent，不经过这一步。
  remove_alpha_ios: true
  background_color_ios: "#000000"
  # Android 自适应图标：底层纯黑，前景是透明的深色版图形，由系统合成形状。
  # 前景单独一份，不跟关于页共用：系统遮罩只留中间 2/3，前景得收进这个圆里，
  # 比关于页那份小不少（比例见 build_icons.py 的 RATIO）。
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/app_icon_android.png
  # Android 13 起，系统设置里有「主题图标」开关（默认关）。用户打开后，系统按
  # 壁纸取色、把桌面图标统一刷成一套色调；它需要应用给一份只有轮廓的剪影才能
  # 这么做。缺这一层，开关一开我们就是满屏里唯一不合群的那个。
  # 源图由 scripts/icons/build_android_monochrome.py 从前景层派生（位置逐像素
  # 对齐，并滤掉母版的霓虹辉光），与前景层共用同一个 inset。
  adaptive_icon_monochrome: assets/app_icon_android_monochrome.png
  min_sdk_android: 21
  web:
    generate: true
    # 标签图标只有 16 像素，取迷你图形（简化且顶满），跟主屏幕那份分开
    image_path: "assets/app_icon_web.png"
    background_color: "#000000"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/app_icon_macos.png"
