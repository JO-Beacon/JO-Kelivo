name: Build Windows

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '上传到 GitHub Release 草稿'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release 标签，例如 v0.1.6'
        required: false
        default: ''
        type: string
      prerelease:
        description: '标记为预发布版本'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Inject fallback secrets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path lib/secrets | Out-Null
          @"
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          "@ | Set-Content -LiteralPath lib/secrets/fallback.dart -Encoding utf8

      - name: Resolve version
        shell: pwsh
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rawVersion = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1).Matches[0].Groups[1].Value)
          $releaseVersion = $rawVersion.Split('+')[0]
          $version = $rawVersion
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$releaseVersion") {
              throw "Tag $env:GITHUB_REF_NAME does not match pubspec version $releaseVersion."
            }
          } elseif ($env:PUBLISH_RELEASE -eq 'true') {
            if ($env:RELEASE_TAG -ne "v$releaseVersion") {
              throw "Release tag must be v$releaseVersion."
            }
          } else {
            $shortSha = (git rev-parse --short HEAD).Trim()
            $version = "${version}_${shortSha}"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved version: $version"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath "JO-Kelivo-v$env:VERSION-windows-x64-portable.zip"

      - name: Package setup EXE
        shell: pwsh
        run: |
          ./scripts/windows/build_installer.ps1 -AppVersion $env:VERSION -OutputDir .

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -File "JO-Kelivo-v$env:VERSION-windows-x64-*" | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -LiteralPath "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: |
            JO-Kelivo-v*-windows-x64-portable.zip
            JO-Kelivo-v*-windows-x64-portable.zip.sha256
            JO-Kelivo-v*-windows-x64-setup.exe
            JO-Kelivo-v*-windows-x64-setup.exe.sha256
          if-no-files-found: error

      - name: Upload assets to draft GitHub Release
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.release_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          body_path: .github/release-notes/${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}.md
          draft: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          files: |
            JO-Kelivo-v*-windows-x64-portable.zip
            JO-Kelivo-v*-windows-x64-portable.zip.sha256
            JO-Kelivo-v*-windows-x64-setup.exe
            JO-Kelivo-v*-windows-x64-setup.exe.sha256
