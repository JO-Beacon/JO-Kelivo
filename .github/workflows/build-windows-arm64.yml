name: Build Windows ARM64

# Windows on ARM（原生 ARM64 版）构建通道。与 build-windows.yml（x64）相互独立：
# 这条线出问题不会影响 x64 的发版链路。
#
# 关键背景（2026-09-12 查证，首跑失败后修正）：
# - `flutter build windows` 没有选择目标架构的参数，目标跟 Dart 虚拟机的芯片走
#   （dart:ffi 的 Abi.current() 读的是运行中的进程）。x64 的 Dart 在 ARM 机器上被
#   系统模拟运行时会自认 x64、编出 x64 产物（首跑即栽在这里）。因此必须让工具链
#   跑在原生 ARM64 的 Dart 上。
# - Flutter 的发布包只自带 x64 Dart，但官方 CDN 为同一引擎版本提供原生 ARM64 的
#   Dart SDK（dart-sdk-windows-arm64.zip，3.44.9 实测可达）。下面的
#   Install native ARM64 Dart SDK 步骤负责换装；换掉 Dart 目录后保持引擎版本戳
#   不动，Flutter 的自更新脚本比对戳一致就不会改回去。
# - x64 交叉编译 ARM64 上游尚未实现，本流水线必须跑在 windows-11-arm 上。

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '上传到 GitHub Release 草稿'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release 标签，例如 0.1.7+7'
        required: false
        default: ''
        type: string
      prerelease:
        description: '标记为预发布版本'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  build-windows-arm64:
    name: Build Windows ARM64
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          # 必须显式指定 x64：Flutter 的发布包没有 ARM64 版本（只有 Dart 有），
          # 不指定的话 action 会去找 arm64 的 Flutter 归档并失败。Dart 随后换装。
          architecture: x64

      - name: Install native ARM64 Dart SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Flutter 的构建目标跟 Dart 虚拟机的架构走：发布包自带的 x64 Dart 在 ARM
          # 机器上被模拟运行时会误判主机、编出 x64。官方 CDN 为同一引擎版本提供
          # 原生 ARM64 的 Dart SDK，这里换装它；引擎版本戳保持不动，Flutter 的
          # 自更新脚本比对一致就不会把 x64 装回来。
          $engineVersion = (Get-Content "$env:FLUTTER_ROOT\bin\cache\engine.stamp").Trim()
          $url = "https://storage.googleapis.com/flutter_infra_release/flutter/$engineVersion/dart-sdk-windows-arm64.zip"
          $cache = "$env:FLUTTER_ROOT\bin\cache"
          $zip = "$cache\dart-sdk-windows-arm64.zip"
          Write-Host "Downloading native ARM64 Dart SDK for engine $engineVersion"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Remove-Item -Recurse -Force "$cache\dart-sdk"
          Expand-Archive -Path $zip -DestinationPath $cache -Force
          Remove-Item -Force $zip
          Write-Host "Dart in use now:"
          & "$cache\dart-sdk\bin\dart.exe" --version

      - name: Resolve version
        shell: pwsh
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rawVersion = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1).Matches[0].Groups[1].Value)
          $releaseVersion = $rawVersion.Split('+')[0]
          $version = $rawVersion
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne $rawVersion) {
              throw "Tag $env:GITHUB_REF_NAME does not match pubspec version $releaseVersion."
            }
          } elseif ($env:PUBLISH_RELEASE -eq 'true') {
            if ($env:RELEASE_TAG -ne $rawVersion) {
              throw "Release tag must be $rawVersion."
            }
          } else {
            $shortSha = (git rev-parse --short HEAD).Trim()
            $version = "${version}_${shortSha}"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved version: $version"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path 'build/windows/arm64/runner/Release/*' -DestinationPath "JO-AIClient-v$env:VERSION-windows-arm64-portable.zip"

      - name: Package setup EXE
        shell: pwsh
        run: |
          ./scripts/windows/build_installer.ps1 -AppVersion $env:VERSION -SourceDir "build/windows/arm64/runner/Release" -SetupArch arm64 -OutputDir .

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -File "JO-AIClient-v$env:VERSION-windows-arm64-*" | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -LiteralPath "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload Windows ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-arm64
          path: |
            JO-AIClient-v*-windows-arm64-portable.zip
            JO-AIClient-v*-windows-arm64-portable.zip.sha256
            JO-AIClient-v*-windows-arm64-setup.exe
            JO-AIClient-v*-windows-arm64-setup.exe.sha256
          if-no-files-found: error

      - name: Upload assets to draft GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          body_path: .github/release-notes/${{ inputs.release_tag }}.md
          draft: true
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            JO-AIClient-v*-windows-arm64-portable.zip
            JO-AIClient-v*-windows-arm64-portable.zip.sha256
            JO-AIClient-v*-windows-arm64-setup.exe
            JO-AIClient-v*-windows-arm64-setup.exe.sha256
